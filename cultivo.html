<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173b2a">
  <title>Cultivo</title>
  <style>
    :root{
      --bg:#f4f7f3; --card:#fff; --text:#172019; --muted:#6b756d;
      --green:#173b2a; --green2:#2f6b48; --line:#e2e8e3; --accent:#dfeee3;
      --danger:#a33a32; --radius:18px;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
    .app{max-width:720px;margin:auto;padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom))}
    header{padding:22px 4px 12px}
    h1{margin:0;font-size:32px;letter-spacing:-1px}
    .sub{color:var(--muted);margin-top:5px}
    .tabs{display:flex;gap:8px;overflow:auto;padding:8px 0 14px;position:sticky;top:0;background:rgba(244,247,243,.94);backdrop-filter:blur(12px);z-index:5}
    .tab{border:0;background:#e7eee8;color:var(--green);padding:10px 15px;border-radius:999px;font-weight:700;white-space:nowrap}
    .tab.active{background:var(--green);color:white}
    .view{display:none}.view.active{display:block}
    .hero{background:var(--green);color:white;border-radius:24px;padding:22px;margin:4px 0 14px;box-shadow:0 8px 25px #173b2a1c}
    .hero .small{opacity:.75;font-size:13px}.hero .big{font-size:42px;font-weight:800;margin:4px 0}.hero p{margin:0;opacity:.9}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
    .metric{font-size:24px;font-weight:800}.label{font-size:13px;color:var(--muted);margin-top:3px}
    .section-title{font-size:19px;font-weight:800;margin:20px 2px 10px}
    .task{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);padding:14px;border-radius:16px;margin-bottom:8px}
    .task input{width:22px;height:22px;accent-color:var(--green)}
    .task.done .tasktext{text-decoration:line-through;color:var(--muted)}
    .date{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
    button.primary{width:100%;border:0;background:var(--green);color:white;padding:14px;border-radius:14px;font-size:16px;font-weight:800}
    form{display:grid;gap:12px}
    label{font-weight:700;font-size:14px}
    input[type="date"],input[type="text"]{width:100%;padding:13px;border:1px solid #cfd8d0;border-radius:12px;background:white;font-size:16px;margin-top:6px}
    .empty{text-align:center;color:var(--muted);padding:30px 15px}
    .danger{background:#fff1f0;color:var(--danger);border:1px solid #f0d2cf;padding:12px;border-radius:13px;margin-top:12px}
    .footer{color:var(--muted);font-size:12px;text-align:center;padding:25px 0}
  </style>
</head>
<body>
<div class="app">
  <header>
    <h1>🌱 Cultivo</h1>
    <div class="sub">Tu cultivo, organizado día a día.</div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-view="inicio">Inicio</button>
    <button class="tab" data-view="calendario">Calendario</button>
    <button class="tab" data-view="cultivo">Mi cultivo</button>
  </nav>

  <main>
    <section id="inicio" class="view active">
      <div id="dashboard"></div>
    </section>

    <section id="calendario" class="view">
      <div class="section-title">Tareas</div>
      <div id="tasks"></div>
    </section>

    <section id="cultivo" class="view">
      <div class="card">
        <div class="section-title" style="margin-top:0">Configurar cultivo</div>
        <form id="cropForm">
          <div>
            <label for="cropName">Nombre</label>
            <input id="cropName" type="text" placeholder="Ej. Cultivo 1">
          </div>
          <div>
            <label for="germination">Fecha de germinación</label>
            <input id="germination" type="date" required>
          </div>
          <button class="primary" type="submit">Guardar cultivo</button>
        </form>
        <div id="resetBox"></div>
      </div>
    </section>
  </main>

  <div class="footer">Los datos se guardan en este dispositivo.</div>
</div>

<script>
const KEY="cultivo_v1";
const defaultData={
  name:"Mi cultivo",
  germination:"",
  completed:{}
};
let data=JSON.parse(localStorage.getItem(KEY)||"null")||defaultData;

const phases=[
  {from:0,to:7,name:"Germinación"},
  {from:8,to:21,name:"Plántula"},
  {from:22,to:45,name:"Crecimiento"},
  {from:46,to:75,name:"Desarrollo"},
  {from:76,to:9999,name:"Fase final"}
];

const care=[
  [0,"Comprobar germinación","Revisar que las condiciones iniciales sean correctas."],
  [3,"Revisión","Comprobar humedad y estado general."],
  [7,"Revisión semanal","Revisar evolución y registrar observaciones."],
  [14,"Revisión","Comprobar crecimiento y estado general."],
  [21,"Revisión semanal","Evaluar la evolución del cultivo."],
  [28,"Revisión","Comprobar desarrollo y necesidades."],
  [35,"Revisión semanal","Registrar el estado del cultivo."],
  [42,"Revisión","Comprobar desarrollo."],
  [49,"Revisión semanal","Registrar evolución."],
  [56,"Revisión","Comprobar estado general."],
  [63,"Revisión semanal","Registrar evolución."],
  [70,"Revisión","Comprobar desarrollo."],
  [77,"Revisión semanal","Registrar evolución."],
  [84,"Revisión","Comprobar estado general."]
];

function save(){localStorage.setItem(KEY,JSON.stringify(data));}

function today(){return new Date(new Date().toDateString());}
function parseDate(s){return new Date(s+"T00:00:00");}
function dayNumber(){
  if(!data.germination)return null;
  return Math.max(1,Math.floor((today()-parseDate(data.germination))/86400000)+1);
}
function phase(d){
  if(d==null)return "Sin configurar";
  return phases.find(p=>d-1>=p.from&&d-1<=p.to)?.name||"Fase final";
}
function fmtDate(d){
  return d.toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit",year:"numeric"});
}

function render(){
  document.getElementById("cropName").value=data.name||"";
  document.getElementById("germination").value=data.germination||"";
  renderDashboard(); renderTasks();
  document.getElementById("resetBox").innerHTML=data.germination?
    '<div class="danger"><button id="reset" style="border:0;background:none;color:inherit;font-weight:700;padding:0">Borrar cultivo</button></div>':"";
  const reset=document.getElementById("reset");
  if(reset)reset.onclick=()=>{if(confirm("¿Borrar los datos del cultivo?")){data=defaultData;save();render()}};
}

function renderDashboard(){
  const d=dayNumber();
  const name=data.name||"Mi cultivo";
  if(!data.germination){
    document.getElementById("dashboard").innerHTML=`
      <div class="hero"><div class="small">Bienvenido</div><div class="big">🌱</div><p>Configura tu cultivo para empezar.</p></div>
      <button class="primary" onclick="show('cultivo')">Configurar cultivo</button>`;
    return;
  }
  const next=care.find(x=>x[0]>=d-1 && !data.completed[x[0]]);
  document.getElementById("dashboard").innerHTML=`
    <div class="hero">
      <div class="small">${escapeHtml(name)}</div>
      <div class="big">Día ${d}</div>
      <p>${phase(d)} · Germinación: ${fmtDate(parseDate(data.germination))}</p>
    </div>
    <div class="grid">
      <div class="card"><div class="metric">${phase(d)}</div><div class="label">Fase actual</div></div>
      <div class="card"><div class="metric">${care.filter(x=>x[0]<d-1).length}</div><div class="label">Revisiones pasadas</div></div>
    </div>
    <div class="section-title">Próxima tarea</div>
    ${next?`<div class="task"><div>🌱</div><div class="tasktext"><b>${next[1]}</b><br><span style="color:var(--muted);font-size:13px">${next[2]}</span></div><div class="date">Día ${next[0]+1}</div></div>`:'<div class="card">No hay tareas pendientes.</div>'}`;
}

function renderTasks(){
  const box=document.getElementById("tasks");
  if(!data.germination){box.innerHTML='<div class="empty">Configura primero la fecha de germinación.</div>';return;}
  box.innerHTML=care.map((x,i)=>{
    const checked=!!data.completed[x[0]];
    return `<label class="task ${checked?'done':''}">
      <input type="checkbox" data-day="${x[0]}" ${checked?'checked':''}>
      <div class="tasktext"><b>${x[1]}</b><br><span style="color:var(--muted);font-size:13px">${x[2]}</span></div>
      <div class="date">Día ${x[0]+1}</div>
    </label>`;
  }).join("");
  box.querySelectorAll("input").forEach(el=>el.onchange=()=>{
    const day=el.dataset.day;
    if(el.checked)data.completed[day]=true; else delete data.completed[day];
    save();render();
  });
}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}

function show(id){
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.querySelector(`[data-view="${id}"]`).classList.add("active");
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>show(t.dataset.view));

document.getElementById("cropForm").onsubmit=e=>{
  e.preventDefault();
  data.name=document.getElementById("cropName").value.trim()||"Mi cultivo";
  data.germination=document.getElementById("germination").value;
  save(); render(); show("inicio");
};

render();
</script>
</body>
</html>
