<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173b2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Cultivador</title>

<style>
:root{
 --bg:#f4f7f3;
 --card:#ffffff;
 --ink:#142019;
 --muted:#718078;
 --green:#173b2a;
 --green2:#2f6b48;
 --soft:#e5eee7;
 --line:#dfe7e1;
 --warn:#fff3dc;
 --blue:#e9f2ff;
 --radius:20px;
}

*{box-sizing:border-box}

body{
 margin:0;
 background:var(--bg);
 color:var(--ink);
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
}

.app{
 max-width:760px;
 margin:auto;
 padding:
 calc(12px + env(safe-area-inset-top))
 16px
 calc(30px + env(safe-area-inset-bottom));
}

header{
 padding:12px 2px 16px;
}

.brand{
 display:flex;
 align-items:center;
 gap:10px;
}

.leaf{
 font-size:34px;
}

h1{
 font-size:30px;
 margin:0;
 letter-spacing:-1px;
}

.subtitle{
 color:var(--muted);
 margin-top:3px;
}

.tabs{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:6px;
 margin-bottom:14px;
}

.tab{
 border:0;
 background:#e5ece7;
 color:var(--green);
 padding:11px 3px;
 border-radius:14px;
 font-weight:800;
 font-size:12px;
}

.tab.active{
 background:var(--green);
 color:#fff;
}

.view{
 display:none;
}

.view.active{
 display:block;
}

.card{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:var(--radius);
 padding:18px;
 margin-bottom:12px;
}

.hero{
 background:var(--green);
 color:#fff;
 border-radius:24px;
 padding:22px;
 margin-bottom:12px;
}

.hero small{
 opacity:.75;
}

.hero h2{
 font-size:40px;
 margin:5px 0 2px;
}

.hero p{
 margin:0;
 opacity:.9;
 line-height:1.4;
}

.section{
 font-size:19px;
 font-weight:850;
 margin:20px 3px 10px;
}

.stats{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
}

.stat{
 background:#fff;
 border:1px solid var(--line);
 border-radius:17px;
 padding:15px;
}

.stat b{
 display:block;
 font-size:20px;
}

.stat span{
 font-size:12px;
 color:var(--muted);
}

.task{
 display:flex;
 gap:12px;
 align-items:flex-start;
 background:#fff;
 border:1px solid var(--line);
 border-radius:16px;
 padding:14px;
 margin-bottom:8px;
}

.check{
 width:23px;
 height:23px;
 accent-color:var(--green);
 margin-top:1px;
}

.task.done{
 opacity:.55;
}

.task.done .task-title{
 text-decoration:line-through;
}

.task-body{
 flex:1;
}

.task-title{
 font-weight:800;
}

.task-desc{
 color:var(--muted);
 font-size:13px;
 margin-top:4px;
 line-height:1.45;
}

.daytag{
 font-size:11px;
 color:var(--muted);
 white-space:nowrap;
}

label{
 display:block;
 font-weight:750;
 font-size:14px;
 margin-bottom:12px;
}

input,select{
 width:100%;
 margin-top:6px;
 padding:14px;
 border:1px solid #cbd6cd;
 border-radius:13px;
 background:#fff;
 font-size:16px;
 color:var(--ink);
}

button.primary{
 width:100%;
 border:0;
 border-radius:14px;
 background:var(--green);
 color:#fff;
 padding:15px;
 font-size:16px;
 font-weight:850;
}

button.secondary{
 border:1px solid var(--line);
 border-radius:14px;
 background:#fff;
 color:var(--green);
 padding:12px;
 font-weight:800;
}

.full{
 width:100%;
 margin-top:8px;
}

.progress{
 height:9px;
 background:#dfe8e1;
 border-radius:99px;
 overflow:hidden;
 margin:12px 0 4px;
}

.progress>i{
 display:block;
 height:100%;
 background:var(--green2);
 border-radius:99px;
}

.empty{
 text-align:center;
 color:var(--muted);
 padding:28px 10px;
}

.notice{
 background:var(--warn);
 border-radius:15px;
 padding:13px;
 font-size:13px;
 line-height:1.45;
 margin-top:10px;
}

.info{
 background:var(--blue);
 border-radius:15px;
 padding:13px;
 font-size:13px;
 line-height:1.45;
 margin-top:10px;
}

.calendar{
 display:grid;
 grid-template-columns:repeat(7,1fr);
 gap:5px;
}

.calhead{
 text-align:center;
 font-size:10px;
 color:var(--muted);
 font-weight:800;
 padding:4px 0;
}

.calday{
 border:1px solid var(--line);
 background:#fff;
 border-radius:10px;
 min-height:62px;
 padding:6px;
 font-size:11px;
 color:var(--ink);
}

.calday strong{
 display:block;
 font-size:14px;
 margin-bottom:3px;
}

.calday span{
 display:block;
 color:var(--muted);
}

.calday.has{
 background:var(--soft);
 border-color:#bdd0c2;
}

.calday.today{
 outline:2px solid var(--green);
}

.calday.selected{
 outline:3px solid var(--green2);
}

.calday.emptyday{
 background:transparent;
 border:0;
}

.monthNav{
 display:grid;
 grid-template-columns:1fr auto 1fr;
 gap:7px;
 align-items:center;
 margin-bottom:14px;
}

.monthTitle{
 text-align:center;
 font-weight:850;
 text-transform:capitalize;
}

.smallButton{
 border:1px solid var(--line);
 background:#fff;
 border-radius:12px;
 padding:10px;
 font-weight:800;
 color:var(--green);
}

.detailGrid{
 display:grid;
 gap:9px;
}

.detail{
 background:#f8faf8;
 border-radius:15px;
 padding:14px;
}

.detailTitle{
 font-weight:850;
 margin-bottom:5px;
}

.badge{
 display:inline-block;
 background:var(--soft);
 color:var(--green);
 padding:5px 9px;
 border-radius:999px;
 font-size:11px;
 font-weight:800;
 margin-bottom:8px;
}

.footer{
 text-align:center;
 color:var(--muted);
 font-size:11px;
 padding:18px 0;
}

@media(max-width:420px){
 .tab{
  font-size:11px;
 }
 .calday{
  min-height:58px;
  padding:5px;
 }
}
</style>
</head>

<body>

<div class="app">

<header>
 <div class="brand">
  <span class="leaf">🌱</span>
  <div>
   <h1>Cultivador</h1>
   <div class="subtitle">Tu cultivo, día a día.</div>
  </div>
 </div>
</header>

<nav class="tabs">

<button class="tab active" data-view="hoy">
 Hoy
</button>

<button class="tab" data-view="calendario">
 Calendario
</button>

<button class="tab" data-view="config">
 Mi cultivo
</button>

<button class="tab" data-view="guia">
 Guía
</button>

</nav>

<section id="hoy" class="view active"></section>

<section id="calendario" class="view"></section>

<section id="config" class="view"></section>

<section id="guia" class="view"></section>

<div class="footer">
 Los datos se guardan en este dispositivo.
</div>

</div>


<script>

const KEY="cultivador_v3";

const defaultData={
 name:"Mi cultivo",
 species:"",
 variety:"",
 pot:"",
 substrate:"",
 start:"",
 completed:{}
};

let data=
 JSON.parse(localStorage.getItem(KEY)||"null")
 || defaultData;

let selectedDay=null;
let calendarMonthOffset=0;


/* =========================
   FASES GENERALES
========================= */

const phases=[

 {
  a:1,
  b:7,
  n:"Inicio",
  d:"Periodo inicial de establecimiento."
 },

 {
  a:8,
  b:21,
  n:"Plántula",
  d:"Desarrollo inicial y adaptación."
 },

 {
  a:22,
  b:45,
  n:"Crecimiento",
  d:"Periodo de crecimiento activo."
 },

 {
  a:46,
  b:75,
  n:"Desarrollo",
  d:"Desarrollo avanzado de la planta."
 },

 {
  a:76,
  b:9999,
  n:"Fase avanzada",
  d:"Seguimiento de una planta ya establecida."
 }

];


/* =========================
   TAREAS
========================= */

const tasks=[

 [1,
  "Revisión inicial",
  "Comprobar el estado general, el sustrato, el recipiente y el drenaje."
 ],

 [2,
  "Control del sustrato",
  "Comprobar la humedad antes de aportar agua."
 ],

 [3,
  "Revisión general",
  "Observar hojas, tallos y aspecto general."
 ],

 [4,
  "Control ambiental",
  "Revisar temperatura, ventilación y humedad ambiental."
 ],

 [5,
  "Revisión",
  "Comprobar evolución y registrar cualquier incidencia."
 ],

 [6,
  "Control de humedad",
  "Comprobar nuevamente el sustrato antes de regar."
 ],

 [7,
  "Revisión semanal",
  "Revisión completa del cultivo."
 ],

 [10,
  "Revisión de crecimiento",
  "Comprobar desarrollo y espacio disponible para las raíces."
 ],

 [14,
  "Revisión semanal",
  "Revisar crecimiento, sustrato y condiciones ambientales."
 ],

 [15,
  "Revisión del recipiente",
  "Valorar si el sistema radicular necesita más espacio."
 ],

 [21,
  "Revisión semanal",
  "Comprobar evolución antes de la siguiente fase."
 ],

 [28,
  "Revisión",
  "Comprobar desarrollo, humedad y estado general."
 ],

 [35,
  "Revisión semanal",
  "Registrar evolución y revisar el recipiente."
 ],

 [42,
  "Revisión",
  "Comprobar desarrollo general."
 ],

 [49,
  "Revisión semanal",
  "Revisar evolución y condiciones del sustrato."
 ],

 [56,
  "Revisión",
  "Buscar signos de exceso o defecto de agua o nutrientes."
 ],

 [63,
  "Revisión semanal",
  "Registrar evolución."
 ],

 [70,
  "Revisión",
  "Comprobar desarrollo."
 ],

 [77,
  "Revisión semanal",
  "Registrar evolución."
 ],

 [84,
  "Revisión",
  "Comprobar estado general."
 ],

 [90,
  "Revisión",
  "Valorar espacio disponible y estado del sustrato."
 ],

 [100,
  "Revisión",
  "Comprobar estado general."
 ],

 [110,
  "Revisión",
  "Registrar evolución."
 ],

 [120,
  "Revisión",
  "Revisión del estado general del ciclo."
 ]

];


/* =========================
   UTILIDADES
========================= */

function save(){
 localStorage.setItem(KEY,JSON.stringify(data));
}

function dateOnly(s){
 return new Date(s+"T00:00:00");
}

function today(){

 const d=new Date();

 return new Date(
  d.getFullYear(),
  d.getMonth(),
  d.getDate()
 );

}

function dayNumber(){

 if(!data.start) return null;

 return Math.max(
  1,
  Math.floor(
   (today()-dateOnly(data.start))/86400000
  )+1
 );

}

function phase(day){

 return phases.find(
  p=>day>=p.a&&day<=p.b
 ) || phases.at(-1);

}

function fmt(d){

 return d.toLocaleDateString(
  "es-ES",
  {
   day:"2-digit",
   month:"2-digit",
   year:"numeric"
  }
 );

}

function esc(s){

 return String(s).replace(
  /[&<>"']/g,
  c=>({
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#039;"
  }[c])
 );

}

function taskFor(day){

 return tasks.filter(
  t=>t[0]===day
 );

}


/* =========================
   NAVEGACIÓN
========================= */

function show(id){

 document
  .querySelectorAll(".view")
  .forEach(x=>x.classList.remove("active"));

 document
  .querySelectorAll(".tab")
  .forEach(x=>x.classList.remove("active"));

 document
  .getElementById(id)
  .classList.add("active");

 document
  .querySelector('[data-view="'+id+'"]')
  .classList.add("active");

 if(id==="hoy")
  renderToday();

 if(id==="calendario")
  renderCalendar();

 if(id==="config")
  renderConfig();

 if(id==="guia")
  renderGuide();

}

document
 .querySelectorAll(".tab")
 .forEach(
  b=>b.onclick=()=>show(b.dataset.view)
 );


/* =========================
   INFORMACIÓN POR FASE
========================= */

function phaseGuidance(day){

 if(day<=7){

  return {

   water:
   "Comprobar siempre el sustrato antes de aportar agua. El objetivo es mantener una humedad adecuada evitando el encharcamiento.",

   humidity:
   "Utiliza la humedad ambiental como referencia y mantenla estable. La ventilación es tan importante como la humedad.",

   feed:
   "Si el sustrato ya contiene nutrientes, normalmente no es necesario añadir fertilizante inmediatamente. Si utilizas un producto, sigue siempre la etiqueta.",

   transplant:
   "No trasplantar simplemente por llegar a un día concreto. Valorar el espacio disponible para las raíces y el estado de la planta."

  };

 }


 if(day<=21){

  return {

   water:
   "Comprobar la humedad del sustrato antes de cada riego. Regar de forma uniforme cuando la planta lo necesite y evitar dejar agua acumulada.",

   humidity:
   "Mantener una humedad ambiental estable y una ventilación adecuada. Las necesidades exactas dependen de la especie y del entorno.",

   feed:
   "Consultar la etiqueta del fertilizante. Si se empieza a utilizar un producto nuevo, es prudente comenzar de forma conservadora y observar la respuesta de la planta.",

   transplant:
   "Valorar trasplante cuando las raíces ocupen gran parte del recipiente, aparezcan por los agujeros de drenaje o el recipiente resulte claramente pequeño."

  };

 }


 if(day<=45){

  return {

   water:
   "No utilizar un calendario fijo de litros. Comprobar primero el sustrato, el peso del recipiente y el drenaje. Ajustar la cantidad a la planta y al tamaño del recipiente.",

   humidity:
   "Controlar la humedad ambiental junto con la ventilación. Evitar ambientes permanentemente saturados.",

   feed:
   "Seguir la dosis indicada por el fabricante del producto utilizado. No mezclar productos sin comprobar previamente su compatibilidad.",

   transplant:
   "Valorar trasplante si el sistema radicular ha ocupado prácticamente todo el recipiente o si el crecimiento se ve limitado por el espacio."

  };

 }


 return {

  water:
  "Regar únicamente cuando las condiciones del sustrato indiquen que es necesario. Evitar tanto el exceso de agua como dejar el cepellón completamente seco durante demasiado tiempo.",

  humidity:
  "Mantener una humedad ambiental estable y buena circulación de aire.",

  feed:
  "Seguir las instrucciones del fabricante y observar la planta para detectar signos de exceso de fertilización.",

  transplant:
  "Solo valorar trasplante si el recipiente se ha quedado pequeño o las raíces están claramente limitadas."

 };

}


/* =========================
   HOY
========================= */

function renderToday(){

 const el=document.getElementById("hoy");

 const day=dayNumber();

 if(!data.start){

  el.innerHTML=`

   <div class="hero">

    <small>Bienvenido</small>

    <h2>Empieza aquí</h2>

    <p>
     Configura tu cultivo y deja que Cultivador
     calcule automáticamente el día del ciclo.
    </p>

   </div>

   <button
    class="primary"
    onclick="show('config')"
   >
    🌱 Configurar mi cultivo
   </button>

  `;

  return;

 }


 const p=phase(day);

 const todayTasks=taskFor(day);

 const done=
  todayTasks.filter(
   t=>data.completed[t[0]]
  ).length;

 const next=
  tasks.find(
   t=>t[0]>day&&!data.completed[t[0]]
  );

 const info=phaseGuidance(day);

 const progress=
  Math.min(
   100,
   Math.round(
    (day%30)/30*100
   )
  );


 el.innerHTML=`

 <div class="hero">

  <small>${esc(data.name)}</small>

  <h2>Día ${day}</h2>

  <p>
   ${esc(p.n)}
   ·
   ${esc(p.d)}
  </p>

  <div class="progress">
   <i style="width:${progress}%"></i>
  </div>

  <small>
   Inicio:
   ${fmt(dateOnly(data.start))}
  </small>

 </div>


 <div class="stats">

  <div class="stat">
   <b>${esc(p.n)}</b>
   <span>Fase actual</span>
  </div>

  <div class="stat">
   <b>${done}/${todayTasks.length}</b>
   <span>Tareas completadas</span>
  </div>

 </div>


 <div class="section">
  📋 Qué toca hoy
 </div>


 ${
  todayTasks.length
   ? todayTasks.map(taskHTML).join("")
   : `
    <div class="card empty">
     No hay una tarea especial programada
     para hoy.
    </div>
   `
 }


 <div class="section">
  💧 Riego
 </div>

 <div class="card">
  <div class="task-desc">
   ${info.water}
  </div>
 </div>


 <div class="section">
  💦 Humedad ambiental
 </div>

 <div class="card">
  <div class="task-desc">
   ${info.humidity}
  </div>
 </div>


 <div class="section">
  🧪 Fertilización
 </div>

 <div class="card">
  <div class="task-desc">
   ${info.feed}
  </div>
 </div>


 <div class="section">
  🪴 Trasplante
 </div>

 <div class="card">
  <div class="task-desc">
   ${info.transplant}
  </div>
 </div>


 <div class="section">
  ⏭️ Siguiente tarea
 </div>

 ${
  next
   ? `
    <div class="card">
     <b>Día ${next[0]} · ${esc(next[1])}</b>
     <div class="task-desc">
      ${esc(next[2])}
     </div>
    </div>
   `
   : `
    <div class="card empty">
     No hay más tareas programadas.
    </div>
   `
 }

 `;

 bindChecks(el);

}


/* =========================
   TAREAS
========================= */

function taskHTML(t){

 const checked=
  !!data.completed[t[0]];

 return `

 <label class="task ${checked?"done":""}">

  <input
   class="check"
   type="checkbox"
   data-day="${t[0]}"
   ${checked?"checked":""}
  >

  <div class="task-body">

   <div class="task-title">
    ${esc(t[1])}
   </div>

   <div class="task-desc">
    ${esc(t[2])}
   </div>

  </div>

  <span class="daytag">
   Día ${t[0]}
  </span>

 </label>

 `;

}

function bindChecks(root){

 root
  .querySelectorAll("[data-day]")
  .forEach(x=>{

   x.onchange=()=>{

    const d=x.dataset.day;

    if(x.checked)
     data.completed[d]=true;
    else
     delete data.completed[d];

    save();

    renderToday();

   };

  });

}


/* =========================
   CALENDARIO
========================= */

function renderCalendar(){

 const el=
  document.getElementById("calendario");

 if(!data.start){

  el.innerHTML=`

   <div class="card empty">
    Configura primero la fecha de inicio.
   </div>

  `;

  return;

 }

 const start=dateOnly(data.start);

 const current=dayNumber();

 const base=new Date(
  start.getFullYear(),
  start.getMonth()+calendarMonthOffset,
  1
 );

 const y=base.getFullYear();

 const m=base.getMonth();

 const first=new Date(y,m,1);

 const last=new Date(y,m+1,0);

 let html=`

 <div class="card">

  <div class="section" style="margin-top:0">
   📅 Calendario del cultivo
  </div>

  <div class="monthNav">

   <button
    class="smallButton"
    id="prevMonth"
   >
    ‹
   </button>

   <div class="monthTitle">
    ${first.toLocaleDateString(
     "es-ES",
     {
      month:"long",
      year:"numeric"
     }
    )}
   </div>

   <button
    class="smallButton"
    id="nextMonth"
   >
    ›
   </button>

  </div>

  <button
   class="secondary full"
   id="currentMonth"
  >
   Volver al mes de inicio
  </button>

  <div
   class="calendar"
   style="margin-top:12px"
  >
 `;


 [
  "L",
  "M",
  "X",
  "J",
  "V",
  "S",
  "D"
 ].forEach(
  x=>html+=`
   <div class="calhead">
    ${x}
   </div>
  `
 );


 let offset=
  (first.getDay()+6)%7;


 for(let i=0;i<offset;i++){

  html+=`
   <div class="calday emptyday"></div>
  `;

 }


 for(
  let d=1;
  d<=last.getDate();
  d++
 ){

  const dt=new Date(y,m,d);

  const day=
   Math.floor(
    (dt-start)/86400000
   )+1;

  const has=
   day>0 &&
   tasks.some(
    t=>t[0]===day
   );

  const isToday=
   day===current;

  const selected=
   day===selectedDay;

  html+=`

   <button
    class="
     calday
     ${has?"has":""}
     ${isToday?"today":""}
     ${selected?"selected":""}
    "
    data-calday="${day}"
   >

    <strong>${d}</strong>

    ${
     day>0
      ? `<span>Día ${day}</span>`
      : ""
    }

    ${
     has
      ? `<span>• tarea</span>`
      : ""
    }

   </button>

  `;

 }


 html+=`

  </div>

  <div class="notice">

   Pulsa cualquier fecha para consultar
   exactamente qué información corresponde
   a ese día del ciclo.

  </div>

 </div>

 <div id="dayDetail"></div>

 `;


 el.innerHTML=html;


 document
  .getElementById("prevMonth")
  .onclick=()=>{

   calendarMonthOffset--;

   renderCalendar();

  };


 document
  .getElementById("nextMonth")
  .onclick=()=>{

   calendarMonthOffset++;

   renderCalendar();

  };


 document
  .getElementById("currentMonth")
  .onclick=()=>{

   calendarMonthOffset=0;

   renderCalendar();

  };


 el
  .querySelectorAll("[data-calday]")
  .forEach(b=>{

   b.onclick=()=>{

    selectedDay=
     Number(
      b.dataset.calday
     );

    renderCalendar();

   };

  });


 if(selectedDay===null)
  selectedDay=current;


 renderDayDetail(selectedDay);

}


/* =========================
   DETALLE DEL DÍA
========================= */

function renderDayDetail(day){

 const el=
  document.getElementById(
   "dayDetail"
  );

 if(!el) return;

 const d=
  Math.max(
   1,
   Number(day)||1
  );

 const p=phase(d);

 const info=
  phaseGuidance(d);

 const specific=
  taskFor(d);


 el.innerHTML=`

 <div class="card">

  <span class="badge">
   Día ${d}
  </span>

  <div class="section" style="margin-top:4px">

   ${esc(p.n)}

  </div>

  <div class="task-desc">

   ${esc(p.d)}

  </div>


  <div class="section">
   📋 Tareas
  </div>

  ${
   specific.length

   ? specific.map(
      t=>`

       <div class="task">

        <div class="task-body">

         <div class="task-title">
          ${esc(t[1])}
         </div>

         <div class="task-desc">
          ${esc(t[2])}
         </div>

        </div>

       </div>

      `
     ).join("")

   : `

    <div class="info">
     No hay una tarea especial
     programada para este día.
    </div>

   `
  }


  <div class="section">
   💧 Riego
  </div>

  <div class="detail">
   <div class="detailTitle">
    Qué comprobar
   </div>

   <div class="task-desc">
    ${info.water}
   </div>
  </div>


  <div class="section">
   💦 Humedad
  </div>

  <div class="detail">

   <div class="detailTitle">
    Condiciones ambientales
   </div>

   <div class="task-desc">
    ${info.humidity}
   </div>

  </div>


  <div class="section">
   🧪 Fertilización
  </div>

  <div class="detail">

   <div class="detailTitle">
    Nutrientes
   </div>

   <div class="task-desc">
    ${info.feed}
   </div>

  </div>


  <div class="section">
   🪴 Trasplante
  </div>

  <div class="detail">

   <div class="detailTitle">
    Comprobar raíces y recipiente
   </div>

   <div class="task-desc">
    ${info.transplant}
   </div>

  </div>

 </div>

 `;

}
